# 显式启用的 M2 验收覆盖；由使用者启动，本文件不会自动启动 Docker 引擎。
services:
  catalog-service:
    environment:
      DEMO_FAULTS_ENABLED: "true"
  payment-service:
    environment:
      DEMO_FAULTS_ENABLED: "true"
  trade-service:
    environment:
      DEMO_FAULTS_ENABLED: "true"
      PAYMENT_WINDOW: 10s
  trade-peer:
    extends:
      file: compose.yaml
      service: trade-service
    ports: !override ["127.0.0.1:18084:8080"]
    environment:
      DEMO_FAULTS_ENABLED: "true"
      PAYMENT_WINDOW: 10s
